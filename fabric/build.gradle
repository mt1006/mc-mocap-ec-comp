plugins
{
	id "fabric-loom" version "${fabric_loom_version}"
}

repositories
{
	maven { url = "https://maven.parchmentmc.org/" }
	maven { url = "https://maven.terraformersmc.com/releases/" }
	maven { url = "https://maven.kosmx.dev/" }
	maven { url = "https://repo.redlance.org/public/" }
	maven { url = "https://api.modrinth.com/maven/" }
}

dependencies
{
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.layered {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
	}

	modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	modCompileOnly "io.github.kosmx.emotes:emotesServer:${emotecraft_version}"
	modImplementation "maven.modrinth:emotecraft:${emotecraft_version}+${minecraft_version}-fabric"
	modImplementation "maven.modrinth:playeranimator:${player_animation_library_version}+${minecraft_version}-fabric"
	modImplementation "maven.modrinth:motion-capture:${mocap_version}-fabric-${minecraft_version}"
	//modImplementation files("mocap-fabric.jar")
}

loom
{
	mixin.useLegacyMixinAp = false
}
