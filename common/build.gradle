plugins
{
	id "fabric-loom" version "${fabric_loom_version}"
}

repositories
{
	maven { url = "https://maven.parchmentmc.org/" }
	maven { url = "https://repo.spongepowered.org/repository/maven-public" }
	maven { url = "https://maven.kosmx.dev/" }
	maven { url = "https://repo.redlance.org/public/" }
	maven { url = "https://api.modrinth.com/maven/" }
}

dependencies
{
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.layered {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
	}

	compileOnly "org.spongepowered:mixin:0.8.5:processor"
	modCompileOnly "io.github.kosmx.emotes:emotesServer:${emotecraft_version}"
	modImplementation "maven.modrinth:motion-capture:${mocap_version}-fabric-${minecraft_version}"
	//modCompileOnly files("mocap-fabric.jar")
}

loom
{
	mixin.useLegacyMixinAp = false
}
